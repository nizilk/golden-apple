<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>私人图书馆</title>
<style>
:root{
  --bg:#f8f5ef;--paper:#fffdf8;--ink:#352f2a;--muted:#948980;--line:#e4dbd1;
  --accent:#8b6256;--accent-soft:#eee2d9;--link:#6e625b;--shadow:0 12px 40px rgba(55,42,34,.08);
}
*{box-sizing:border-box}
html{scrollbar-width:none}html::-webkit-scrollbar,*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:flex}
.sidebar{
  width:188px;flex:0 0 188px;position:sticky;top:0;height:100vh;padding:34px 20px 26px;
  border-right:1px solid var(--line);background:rgba(255,253,248,.78);backdrop-filter:blur(12px)
}
.brand{text-align:center;font-family:"Songti SC","Noto Serif SC","STSong",serif;font-size:22px;font-weight:600;letter-spacing:.12em;margin:3px 0 28px}
.brand small{display:block;font-family:inherit;font-size:9px;font-weight:400;letter-spacing:.25em;color:var(--muted);margin-top:6px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{
  border:0;background:transparent;width:100%;padding:9px 8px;border-radius:8px;
  color:var(--muted);font-size:13px;text-align:center
}
.nav button:hover{background:var(--accent-soft);color:var(--accent)}
.nav button.active{color:var(--accent);font-weight:600;background:var(--accent-soft)}
.sidebar-tools{position:absolute;left:20px;right:20px;bottom:24px;display:flex;flex-direction:column;gap:7px}
.sidebar-tools button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:7px}
.sidebar-tools button:hover{color:var(--accent)}
.main{flex:1;min-width:0}
.top{
  max-width:1040px;margin:auto;padding:34px 42px 18px;display:flex;align-items:flex-end;
  justify-content:space-between;gap:24px;border-bottom:1px solid var(--line)
}
.eyebrow{font-size:9px;letter-spacing:.28em;color:var(--accent);margin-bottom:8px}
h1{font-family:"Songti SC","Noto Serif SC","STSong",serif;font-size:30px;font-weight:500;margin:0}
.subtitle{font-family:"Songti SC","Noto Serif SC","STSong",serif;color:var(--muted);font-size:12px;margin-top:8px}
.top-right{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.search{width:190px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 12px;outline:none;font-size:11px}
.search:focus{border-color:var(--accent)}
.small-btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:7px 11px;font-size:11px}
.small-btn:hover{background:var(--paper);color:var(--accent)}
.content-wrap{max-width:1040px;margin:auto;padding:20px 42px 90px}
.page-intro{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:13px}
.page-intro h2{font-family:"Songti SC","Noto Serif SC","STSong",serif;font-weight:500;font-size:19px;margin:0}
.page-intro small{font-size:10px;color:var(--muted)}
.tags-bar{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 15px;border-bottom:1px solid var(--line);margin-bottom:2px}
.tag-chip{
  border:0;background:transparent;color:var(--muted);font-size:10.5px;padding:5px 9px;border-radius:999px
}
.tag-chip:hover{color:var(--accent);background:var(--accent-soft)}
.tag-chip.on{background:var(--accent);color:#fff}
.story-list{display:flex;flex-direction:column}
.story-row{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start;
  padding:19px 3px 18px;border-bottom:1px solid var(--line);cursor:pointer
}
.story-row:hover .story-title{color:var(--accent)}
.story-title{font-family:"Songti SC","Noto Serif SC","STSong",serif;font-size:18px;font-weight:500;line-height:1.55;margin:0 0 7px}
.story-excerpt{font-family:"Songti SC","Noto Serif SC","STSong",serif;color:#766b63;font-size:12.5px;line-height:1.85;max-width:760px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.story-meta{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px;color:var(--muted);font-size:9.5px}
.story-meta .tag{color:var(--accent)}
.story-side{display:flex;align-items:center;gap:9px;padding-top:3px}
.story-date{font-size:9.5px;color:var(--muted);white-space:nowrap}
.empty{text-align:center;color:var(--muted);font-family:"Songti SC","Noto Serif SC",serif;font-size:13px;line-height:2;padding:80px 20px;display:none}
.fab{
  position:fixed;right:30px;bottom:28px;width:55px;height:55px;border:0;border-radius:50%;
  background:var(--accent);color:#fff;font-size:27px;line-height:1;box-shadow:0 9px 25px rgba(120,80,65,.28);z-index:20
}
.fab:hover{transform:translateY(-1px)}
/* 阅读 */
.reader{position:fixed;inset:0;background:rgba(48,38,32,.42);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:18px;z-index:40}
.reader.show{display:flex}
.read-sheet{
  position:relative;width:min(820px,95vw);height:min(900px,94vh);overflow:auto;
  background:var(--paper);box-shadow:0 24px 90px rgba(35,25,20,.22);padding:52px 72px 70px
}
.read-close{position:absolute;right:18px;top:17px;width:30px;height:30px;border:0;border-radius:50%;background:var(--accent-soft);color:var(--muted)}
.read-kicker{font-size:9px;letter-spacing:.24em;color:var(--accent)}
.read-sheet h2{font-family:"Songti SC","Noto Serif SC","STSong",serif;font-size:31px;line-height:1.55;font-weight:500;margin:10px 0 7px}
.read-meta{font-size:10.5px;color:var(--muted);padding-bottom:17px;border-bottom:1px solid var(--line)}
.read-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.read-tags span{font-size:9.5px;color:var(--accent);background:var(--accent-soft);padding:4px 8px;border-radius:999px}
.article-body{font-family:"Songti SC","Noto Serif SC","STSong",serif;font-size:16px;line-height:2.2;padding-top:28px}
.article-body p{margin:0 0 1.05em}
.article-body h1,.article-body h2,.article-body h3{font-family:"Songti SC","Noto Serif SC","STSong",serif;font-weight:500;line-height:1.6;margin:1.2em 0 .6em}
.read-actions{display:flex;gap:7px;border-top:1px solid var(--line);padding-top:15px;margin-top:38px}
.read-actions button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:7px 12px;font-size:10.5px}
.read-actions button:hover{background:var(--accent-soft);color:var(--accent)}
.reader-loading,
.reader-note{
  color:var(--muted);
  font-size:12px;
  line-height:1.8;
}
/* 弹窗 */
.overlay{position:fixed;inset:0;background:rgba(38,29,25,.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.overlay.show{display:flex}
.dialog{width:min(650px,95vw);max-height:92vh;overflow:auto;background:var(--paper);padding:30px 32px 28px;box-shadow:var(--shadow);position:relative}
.dialog h2{font-family:"Songti SC","Noto Serif SC","STSong",serif;font-size:22px;font-weight:500;margin:0 0 22px}
.dialog-close{position:absolute;right:17px;top:17px;width:29px;height:29px;border:0;border-radius:50%;background:var(--accent-soft);color:var(--muted)}
.field{margin-bottom:15px}.field label{display:block;color:var(--muted);font-size:10.5px;margin-bottom:6px}
.field input,.field textarea,.field select{
  width:100%;border:1px solid var(--line);background:transparent;border-radius:7px;padding:9px 10px;outline:none;font-size:12.5px
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{min-height:130px;resize:vertical;line-height:1.8}
.form-row{display:flex;gap:10px}.form-row>.field{flex:1}
.dialog-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:22px}
.dialog-actions .right{display:flex;gap:7px}
.btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:8px 13px;font-size:10.5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:#a05c5c}
.mode-row{display:flex;gap:6px;margin-bottom:15px}
.mode-btn{flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:7px;padding:8px;font-size:10.5px}
.mode-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.filebox{border:1px dashed #cdbdb2;padding:15px;text-align:center;color:var(--muted);font-size:11px}
.hint{font-size:9.5px;color:var(--muted);line-height:1.7;margin-top:6px}
/* 页面管理 */
.manage-pages{display:flex;flex-direction:column;gap:5px}
.manage-page{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:9px 2px}
.manage-page span{flex:1;font-size:12px}
.manage-page button{border:0;background:transparent;color:var(--muted);font-size:10px}
.manage-page button:hover{color:var(--accent)}
.folder-box{border:1px dashed #cdbdb2;padding:15px;text-align:center;color:var(--muted);font-size:11px}
.cover-preview{width:100%;height:100px;border:1px solid var(--line);background:var(--accent-soft) center/cover no-repeat;margin-bottom:9px}

.library-hero{
  width:100%;
  aspect-ratio:2.35 / 1;
  min-height:280px;
  max-height:430px;
  margin:0 0 28px;
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  background:var(--accent-soft);
  box-shadow:var(--shadow);
}

.library-hero-image{
  width:100%;
  height:100%;
  background:
    linear-gradient(135deg,#d8c8bd,#eee5dc);
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
}

.story-file{
  margin-top:9px;
  color:var(--muted);
  font-size:9.5px;
  letter-spacing:.02em;
}

.content-preview{
  border:1px solid var(--line);
  background:#fbf8f2;
  border-radius:8px;
  padding:10px;
  max-height:420px;
  overflow:auto;
}

.content-preview-item{
  border-bottom:1px solid var(--line);
  padding:10px 8px;
}

.content-preview-item:last-child{
  border-bottom:0;
}

.content-preview-control{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:6px;
  color:var(--muted);
  font-size:10px;
}

.content-preview-text{
  font-family:"Songti SC","Noto Serif SC","STSong",serif;
  font-size:12.5px;
  line-height:1.8;
  white-space:pre-wrap;
  color:var(--ink);
}

.content-preview-item.removed{
  opacity:.45;
}

.content-preview-item.removed .content-preview-text{
  text-decoration:line-through;
}

/* responsive */
@media(max-width:760px){
 .app{display:block}.sidebar{position:static;width:auto;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:18px 16px}
 .brand{margin-bottom:12px}.nav{flex-direction:row;overflow:auto}.nav button{white-space:nowrap}
 .sidebar-tools{position:static;flex-direction:row;justify-content:center;margin-top:8px}.sidebar-tools button{padding:5px 8px}

  .top{
    padding:18px 20px 10px;
    align-items:flex-start;
  }

  .top-right{
    width:100%;
    display:flex;
  }

  .search{
    flex:1;
    width:auto;
  }

  .content-wrap{
    padding:18px 20px 80px;
  }

  .library-hero{
    aspect-ratio:1.6 / 1;
    min-height:220px;
    max-height:300px;
    margin-bottom:22px;
  }

 .story-row{grid-template-columns:minmax(0,1fr)}.story-side{display:none}.read-sheet{padding:42px 25px 55px}.read-sheet h2{font-size:26px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">私人图书馆<small>PRIVATE LIBRARY</small></div>
  <nav class="nav" id="nav"></nav>
  <div class="sidebar-tools">
    <button id="managePagesBtn">页面管理</button>
    <button id="manageLibraryBtn">本地文件</button>
    <button id="settingsBtn">书房设置</button>
  </div>
</aside>

<main class="main">
<header class="top">
  <div class="top-right">
    <input class="search" id="search" placeholder="搜索标题 / 作者 / 标签">
    <button class="small-btn" id="sortBtn">最近加入</button>
  </div>
</header>


<div class="content-wrap">
  <div class="library-hero" id="libraryHero">
    <div class="library-hero-image" id="libraryHeroImage"></div>
  </div>
  <div class="page-intro">
    <h2 id="sectionTitle">故事</h2><small id="count"></small>
  </div>
  <div class="tags-bar" id="tagsBar"></div>
  <section class="story-list" id="storyList"></section>
  <div class="empty" id="empty">这里还没有故事。<br>点击右下角的 ＋，导入一篇 Word 或手动创建文章。</div>
</div>
</main>
</div>

<button class="fab" id="addBtn" title="添加文章">＋</button>

<!-- 添加 / 编辑 -->
<div class="overlay" id="storyOverlay">
<div class="dialog">
<button class="dialog-close" id="storyClose">×</button>
<h2 id="storyDialogTitle">添加文章</h2>

<div class="mode-row" id="modeRow">
  <button class="mode-btn active" id="modeFile">
    添加本地 .docx
  </button>
</div>

<div id="fileMode">
  <div class="field">
    <label>本地 Word 文件</label>

    <div class="filebox">
      <button class="btn" id="chooseStoryFile" type="button">
        选择 .docx 文件
      </button>

    </div>
  </div>
</div>

<div id="editFields">

  <div class="form-row">
    <div class="field">
      <label>标题</label>
      <input id="storyTitle" placeholder="文章标题">
    </div>

    <div class="field">
      <label>作者</label>
      <input id="storyAuthor" placeholder="作者名">
    </div>
  </div>

  <div class="field">
    <label>来源平台</label>
    <input id="storyPlatform" placeholder="例如：AO3、LOFTER、微博">
  </div>

  <div class="field">
    <label>原文链接（可选）</label>
    <input id="storySourceUrl" placeholder="https://……">
  </div>

  <div class="field">
    <label>标签（可输入多个，用空格或逗号分隔）</label>
    <input id="storyTags" placeholder="例如：太中 同人 暂存">
  </div>

  <div class="field">
    <label>简介</label>
    <textarea
      id="storySummary"
      style="min-height:110px"
      placeholder="给这篇文章写一小段私人简介……"
    ></textarea>
  </div>

  <div class="field" id="contentAdjustField">
    <label>正文整理</label>

    <div id="contentPreview" class="content-preview">
    </div>
  </div>

</div>

<div class="dialog-actions">
  <button class="btn danger" id="deleteStoryBtn" style="display:none">删除文章</button>
  <div class="right"><button class="btn" id="storyCancel">取消</button><button class="btn primary" id="storySave">保存</button></div>
</div>
</div>
</div>

<!-- 阅读 -->
<div class="reader" id="reader">
<article class="read-sheet">
<button class="read-close" id="readerClose">×</button>
<div class="read-kicker">PRIVATE LIBRARY</div>
<h2 id="rTitle"></h2>
<div class="read-meta" id="rMeta"></div>
<div class="read-tags" id="rTags"></div>
<div class="article-body" id="rContent"></div>
<div class="read-actions">
  <button id="rEdit">编辑</button>
</div>
</article>
</div>

<!-- 页面管理 -->
<div class="overlay" id="pagesOverlay">
<div class="dialog">
<button class="dialog-close" id="pagesClose">×</button>
<h2>页面</h2>
<div class="field"><label>新建页面</label><div class="form-row"><input id="newPageName" placeholder=""><button class="btn primary" id="addPage">新建</button></div></div>
<div class="manage-pages" id="pageList"></div>
</div>
</div>

<!-- 页面配置 -->
<div class="overlay" id="pageConfigOverlay">
<div class="dialog">
<button class="dialog-close" id="pageConfigClose">×</button>
<h2 id="pageConfigTitle">页面内容</h2>
<div class="field"><label>包含哪些文章</label>
<div id="pagePostList" class="manage-pages"></div></div>
</div>
</div>

<!-- 本地文件 -->
<div class="overlay" id="libraryOverlay">
<div class="dialog">
<button class="dialog-close" id="libraryClose">×</button>
<h2>本地文件</h2>
<div class="field"><label>连接文件夹</label>
<div class="folder-box" id="folderBox">尚未连接本地文件夹<br><br><button class="btn" id="chooseFolder">选择文件夹</button></div>
</div>

</div>
</div>

<!-- 书房设置 -->
<div class="overlay" id="settingsOverlay">
<div class="dialog">
<button class="dialog-close" id="settingsClose">×</button>
<h2>书房设置</h2>
<div class="field">
  <label>书房头图</label>

  <div class="cover-preview" id="coverPreview"></div>

  <input type="file" id="coverFile" accept="image/*">

</div>
<div class="dialog-actions"><span></span><button class="btn primary" id="settingsSave">保存</button></div>
</div>
</div>

<script>

const LIBRARY_FILE = "library.json";
let libraryDirectoryHandle = null;

const defaultData={
  settings:{
    title:"私人图书馆",
    subtitle:"",
    cover:""
  },

  pages:[
    {
      id:"all",
      name:"全部",
      postIds:[]
    }
  ],

  currentPage:"all",
  activeTag:"全部",
  tags:["全部"],

  stories:[]
};

let data=structuredClone(defaultData);

let newest=true;
let readerStory=null;
let editingId=null;
let selectedStoryFile=null;

let importedParagraphs=[];
let contentAdjustments=[];

const storySummary=
  document.getElementById("storySummary");

const storyPlatform=
  document.getElementById("storyPlatform");

const storySourceUrl=
  document.getElementById("storySourceUrl");

async function saveData(){

  if(!libraryDirectoryHandle){
    throw new Error("尚未连接 Fanfics 文件夹。");
  }

  const fileHandle=
    await libraryDirectoryHandle.getFileHandle(
      LIBRARY_FILE,
      {create:true}
    );

  const writable=
    await fileHandle.createWritable();

  await writable.write(
    JSON.stringify(data,null,2)
  );

  await writable.close();
}
  
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function strip(html){const d=document.createElement("div");d.innerHTML=html||"";return d.textContent||""}
function normalizeTags(raw){
  return [...new Set(String(raw||"").split(/[\s,，、]+/).map(x=>x.trim()).filter(Boolean))];
}
function allTags(){
  const set=new Set(["全部"]);
  data.stories.forEach(s=>(s.tags||[]).forEach(t=>set.add(t)));
  return [...set];
}
function getPage(){return data.pages.find(p=>p.id===data.currentPage)||data.pages[0]}
function pageStories(){
  const page=getPage();
  let list=data.stories;
  if(page && page.id!=="all") list=list.filter(s=page.postIds.includes(s.id));
  const q=search.value.trim().toLowerCase();
  if(data.activeTag && data.activeTag!=="全部") list=list.filter(s=>(s.tags||[]).includes(data.activeTag));

  if(q){
    list=list.filter(s=>{
      const haystack=[
        s.title,
        s.author,
        ...(s.tags||[])
      ].join(" ").toLowerCase();

      return haystack.includes(q);
    });
  }

  return newest?list:[...list].reverse();
}

function renderNav(){
  nav.innerHTML=data.pages.map(p=>`<button class="${p.id===data.currentPage?'active':''}" data-page="${esc(p.id)}">${esc(p.name)}</button>`).join("");
  nav.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{
    data.currentPage=b.dataset.page;data.activeTag="全部";saveData();renderAll()
  });
}
function renderTags(){
  tagsBar.innerHTML=allTags().map(t=>`<button class="tag-chip ${data.activeTag===t?'on':''}" data-tag="${esc(t)}">#${esc(t)}</button>`).join("");
  tagsBar.querySelectorAll("[data-tag]").forEach(b=>b.onclick=()=>{data.activeTag=b.dataset.tag;render()});
}

function render(){
  const page=getPage();
  sectionTitle.textContent=page.id==="all"?"故事":page.name;
  renderTags();
  const list=pageStories();
  count.textContent=`${list.length} 篇`;
  storyList.innerHTML=list.map(s=>{
    const tags=(s.tags||[]).slice(0,4).map(t=>`<span class="tag">#${esc(t)}</span>`).join("");
    return `<article class="story-row" data-id="${esc(s.id)}">
      <div>
        <h3 class="story-title">${esc(s.title||"无标题")}</h3>

        <div class="story-meta">
          <span>${esc(s.author||"未知作者")}</span>
          ${tags}
        </div>

      </div>

      <div class="story-side">
      </div>
    </article>`
  }).join("");
  empty.style.display=list.length?"none":"block";
  storyList.querySelectorAll(".story-row").forEach(r=>r.onclick=()=>openStory(r.dataset.id));
}
function renderAll(){renderNav();render();}

async function openStory(id){

  const s=data.stories.find(x=>x.id===id);
  if(!s)return;

  readerStory=s;

  rTitle.textContent=s.title||"无标题";

  const meta=[];

  if(s.author){
    meta.push(s.author);
  }

  if(s.platform){
    meta.push(s.platform);
  }

  rMeta.textContent=
    meta.join(" · ");

  rTags.innerHTML=
    (s.tags||[])
      .map(t=>`<span>#${esc(t)}</span>`)
      .join("");

  rContent.innerHTML=
    `<p class="reader-loading">正在读取本地文章……</p>`;

  reader.classList.add("show");

  try{

    if(!s.path){

      rContent.innerHTML=
        `<p>这篇文章没有记录本地文件路径。</p>`;

      return;
    }

    let f;

    try{

      f=
        await getFileByPath(s.path);

    }catch(e){

      rContent.innerHTML=
        `<p>找不到原始 DOCX。</p>
        <p class="reader-note">
          路径：${esc(s.path)}
        </p>
        <p class="reader-note">
          请确认文件仍然位于你的 Fanfics 文件夹中。
        </p>`;

      return;
    }

    const paragraphs=
      await readDocxParagraphs(f);

    const removed=
      new Set(
        s.contentAdjustments?.removed || []
      );

    const visible=
      paragraphs.filter(
        p=>!removed.has(p.index)
      );

    rContent.innerHTML=
      visible
        .map(p=>`<p>${esc(p.text).replace(/\n/g,"<br>")}</p>`)
        .join("")
        ||
        "<p>正文为空。</p>";

  }catch(e){

    console.error(e);

    rContent.innerHTML=
      `<p>读取本地文章失败。</p>
       <p class="reader-note">${esc(e.message)}</p>`;
  }
}

function htmlToPlain(html){
  const d=document.createElement("div");
  d.innerHTML=html||"";

  return [...d.children]
    .map(x=>x.innerText||x.textContent||"")
    .join("\n\n")
    .trim();
}

function plainToHtml(text){
  return String(text||"")
    .trim()
    .split(/\n{2,}/)
    .map(p=>{
      return `<p>${esc(p).replace(/\n/g,"<br>")}</p>`;
    })
    .join("") || "<p></p>";
}

chooseStoryFile.onclick=async()=>{

  if(!window.showOpenFilePicker){

    alert(
      "当前浏览器不支持本地文件选择。\n\n"+
      "请使用最新版 Chrome 或 Edge。"
    );

    return;
  }

  try{

    const [handle]=
      await window.showOpenFilePicker({

        multiple:false,

        types:[
          {
            description:"Word 文档",
            accept:{
              "application/vnd.openxmlformats-officedocument.wordprocessingml.document":[
                ".docx"
              ]
            }
          }
        ]

      });

    selectedStoryHandle=handle;

    const f=
      await handle.getFile();

    selectedStoryFile=f;

    storyFileName.textContent=
      `已选择：${f.name}`;

    /*
     * 读取 DOCX。
     *
     * 注意：
     * 这里读取的是内存中的文件内容。
     * 不会写入 localStorage。
     * 不会写入 IndexedDB。
     * 不会修改 DOCX。
     */

    importedParagraphs=
      await readDocxParagraphs(f);

    contentAdjustments=[];

    /*
     * 根据正文提供“候选标题 / 作者”。
     * 用户仍然可以手动修改。
     */

    const guessed=
      guessMetadata(
        importedParagraphs,
        f.name
      );

    storyTitle.value=
      guessed.title;

    /*
     * 作者先不要盲猜。
     *
     * 因为不同 Fanfics 的格式差异太大。
     * 如果第二段很明显像作者，你可以手动填。
     */

    storyAuthor.value="";

    renderContentPreview();

  }catch(e){

    if(e.name!=="AbortError"){

      alert(
        "无法读取 DOCX：\n\n"+
        e.message
      );

      console.error(e);

    }

  }

};


function renderContentPreview(){

  if(!importedParagraphs.length){

    contentPreview.innerHTML=
      `<div class="hint">没有可显示的正文段落。</div>`;

    return;
  }

  contentPreview.innerHTML=
    importedParagraphs.map((p,index)=>{

      const removed=
        contentAdjustments.includes(index);

      return `
        <div
          class="content-preview-item ${removed?"removed":""}"
          data-paragraph="${index}"
        >

          <div class="content-preview-control">

            <label>
              <input
                type="checkbox"
                data-remove-paragraph="${index}"
                ${removed?"checked":""}
              >
              删除这一段
            </label>

          </div>

          <div class="content-preview-text">
            ${esc(p.text)}
          </div>

        </div>
      `;

    }).join("");

  contentPreview
    .querySelectorAll("[data-remove-paragraph]")
    .forEach(box=>{

      box.onchange=()=>{

        const index=
          Number(box.dataset.removeParagraph);

        if(box.checked){

          if(!contentAdjustments.includes(index)){
            contentAdjustments.push(index);
          }

        }else{

          contentAdjustments=
            contentAdjustments.filter(
              x=>x!==index
            );

        }

        renderContentPreview();

      };

    });

}

storySave.onclick=async()=>{

  const title=
    storyTitle.value.trim();

  if(!title){
    alert("请填写标题。");
    return;
  }

  const tags=
    normalizeTags(storyTags.value);

  if(editingId){

    const s=
      data.stories.find(
        x=>x.id===editingId
      );

    if(!s)return;

    s.title=title;

    s.author=
      storyAuthor.value.trim();

    s.platform=
      storyPlatform.value.trim();

    s.sourceUrl=
      storySourceUrl.value.trim();

    s.tags=tags;

    s.summary=
      storySummary.value.trim();

  }else{

    const f=
      selectedStoryFile;

    const path=
      selectedStoryPath;

    if(!f || !path){

      alert("请先选择一个 .docx 文件。");

      return;
    }

    if(!/\.docx$/i.test(f.name)){
      alert("目前只支持 .docx 文件。");
      return;
    }

    try{

      const id=
        "story_"+
        Date.now()+
        "_"+
        Math.random()
          .toString(36)
          .slice(2,8);

      const s={
        id,
        title,
        author:
          storyAuthor.value.trim(),

        platform:
          storyPlatform.value.trim(),

        sourceUrl:
          storySourceUrl.value.trim(),

        tags,

        summary:
          storySummary.value.trim(),

        date:
          new Date()
            .toISOString()
            .slice(0,10),

        path:path,

        favorite:false,

        sourceType:"word",

        contentAdjustments:{
          removed:
            [...contentAdjustments]
        }

      };

      data.stories.unshift(s);

    }catch(e){

      alert(
        "添加失败："+
        e.message
      );

      console.error(e);

      return;
    }
  }

  /*
   * 更新标签集合
   */
  tags.forEach(t=>{
    if(!data.tags.includes(t)){
      data.tags.push(t);
    }
  });

  saveData();

  selectedStoryFile=null;
  selectedStoryHandle=null;

  importedParagraphs=[];
  contentAdjustments=[];

  closeStoryEditor();
  renderAll();
};

async function getFileByPath(relativePath){

  if(!libraryDirectoryHandle){
    throw new Error("尚未连接 Fanfics 文件夹。");
  }

  const parts=
    relativePath
      .split("/")
      .filter(Boolean);

  if(!parts.length){
    throw new Error("文章路径为空。");
  }

  let dir=
    libraryDirectoryHandle;

  for(let i=0;i<parts.length-1;i++){

    dir=
      await dir.getDirectoryHandle(
        parts[i]
      );

  }

  const fileHandle=
    await dir.getFileHandle(
      parts[parts.length-1]
    );

  return fileHandle.getFile();
}


async function readDocxParagraphs(file){

  if(!window.JSZip){

    await new Promise((resolve,reject)=>{

      const s=document.createElement("script");

      s.src=
        "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";

      s.onload=resolve;

      s.onerror=()=>{
        reject(
          new Error(
            "无法加载 DOCX 解析模块；请检查网络。"
          )
        );
      };

      document.head.appendChild(s);

    });

  }

  const zip=
    await JSZip.loadAsync(
      await file.arrayBuffer()
    );

  const xmlFile=
    zip.file("word/document.xml");

  if(!xmlFile){
    throw new Error("这个文件不是有效的 DOCX 文档。");
  }

  const xml=
    await xmlFile.async("string");

  const doc=
    new DOMParser().parseFromString(
      xml,
      "application/xml"
    );

  const paras=
    [...doc.getElementsByTagName("w:p")];

  const out=[];

  for(const p of paras){

    let text="";

    for(const node of p.childNodes){

      if(node.nodeType!==1) continue;

      const name=node.localName;

      if(name==="r"){

        for(const child of node.childNodes){

          if(child.nodeType!==1) continue;

          if(child.localName==="t"){
            text+=child.textContent||"";
          }

          if(child.localName==="tab"){
            text+="\t";
          }

          if(child.localName==="br"){
            text+="\n";
          }

        }

      }else if(name==="hyperlink"){

        text+=
          [...node.getElementsByTagName("w:t")]
            .map(x=>x.textContent||"")
            .join("");

      }

    }

    text=
      text
        .replace(/\r/g,"")
        .trim();

    if(text){

      out.push({
        index:out.length,
        text
      });

    }

  }

  return out;
}

async function chooseFolder(){

  if(!window.showDirectoryPicker){

    alert(
      "当前浏览器不支持选择本地文件夹。\n\n"+

    if(e.name!=="AbortError"){

      alert(

      );

async function loadLibrary(){

  if(!libraryDirectoryHandle){
    return;
  }

  try{

    const fileHandle=
      await libraryDirectoryHandle.getFileHandle(
        LIBRARY_FILE
      );

    const file=
      await fileHandle.getFile();

    const text=
      await file.text();

    const saved=
      JSON.parse(text);

    data={
      ...structuredClone(defaultData),
      ...saved
    };

    if(!Array.isArray(data.stories)){
      data.stories=[];
    }

    if(!Array.isArray(data.pages)){
      data.pages=
        structuredClone(defaultData.pages);
    }

    if(!Array.isArray(data.tags)){
      data.tags=["全部"];
    }

  }catch(e){

    /*
     * library.json 不存在。
     *
     * 这是第一次使用。
     */

    if(e.name==="NotFoundError"){

      data=
        structuredClone(defaultData);

      await saveData();

      return;
    }

    throw e;
  }

}

async function scanFolder(){

  if(!libraryDirectoryHandle){

    alert("请先连接 Fanfics 文件夹。");

    return;
  }

  const files=[];

  async function walk(
    dir,
    path=""
  ){

    for await(
      const [name,h]
      of dir.entries()
    ){

      const currentPath=
        path
          ? `${path}/${name}`
          : name;

      if(
        h.kind==="file" &&
        /\.docx$/i.test(name)
      ){

        files.push({
          name,
          path:currentPath,
          handle:h
        });

      }else if(
        h.kind==="directory"
      ){

        await walk(
          h,
          currentPath
        );

      }

    }

  }

  await walk(
    libraryDirectoryHandle
  );

  let add=0;
  let existing=0;

  for(const file of files){

    const exists=
      data.stories.some(
        s=>s.path===file.path
      );

    if(exists){

      existing++;

      continue;

    }

    const id=
      "story_"+
      Date.now()+
      "_"+
      Math.random()
        .toString(36)
        .slice(2,8);

    data.stories.unshift({

      id,

      title:
        file.name
          .replace(/\.docx$/i,""),

      author:"",

      platform:"",

      sourceUrl:"",

      tags:[],

      summary:"",

      date:
        new Date()
          .toISOString()
          .slice(0,10),

      path:
        file.path,

      favorite:false,

      sourceType:"word",

      contentAdjustments:{
        removed:[]
      }

    });

    add++;

  }

  await saveData();

  renderAll();

  alert(
    `扫描完成：新增 ${add} 篇，已有 ${existing} 篇。`
  );

}
