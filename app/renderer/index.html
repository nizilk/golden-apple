<body>

  <main class="home">

    <header class="brand">
      <h1>Golden Apple</h1>
    </header>

    <button
      class="theme-toggle"
      id="themeToggle"
      title="切换深色/浅色"
    >☾</button>

    <section class="apps">

      <a
        class="app-card"
        href="private-xhs/private-xhs.html"
      >
        <div class="app-info">
          <div class="app-title">私人小红书</div>
          <div class="app-desc">把偶然遇见的东西，好好留下来。</div>
        </div>

        <div class="app-arrow">›</div>
      </a>

      <a
        class="app-card"
        href="private-library/private-library.html"
      >
        <div class="app-info">
          <div class="app-title">私人图书馆</div>
          <div class="app-desc">有些文字，值得慢一点再读。</div>
        </div>

        <div class="app-arrow">›</div>
      </a>

    </section>

  </main>

<script>
  const themeToggle =
    document.getElementById("themeToggle");

  const savedTheme =
    localStorage.getItem("theme");

  if(savedTheme === "dark"){
    document.body.classList.add("dark");
  }

  function updateThemeIcon(){
    themeToggle.textContent =
      document.body.classList.contains("dark")
        ? "☀"
        : "☾";
  }

  updateThemeIcon();

  themeToggle.onclick = () => {
    document.body.classList.toggle("dark");

    localStorage.setItem(
      "theme",
      document.body.classList.contains("dark")
        ? "dark"
        : "light"
    );

    updateThemeIcon();
  };
</script>

</body>

<style>

:root{
  --bg:#FFFFFF;
  --paper:#FFFFFF;
  --ink:#2B2622;
  --muted:#9A8F86;
  --accent:#D94F63;
  --accent-soft:#F6DDE1;
  --line:#F2F2F2;
  --link:#3B6FD9;
  --tag-bg:#F2F2F2;
  --shadow:0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);

  color-scheme:light;
}

body.dark{
  --bg:#0f0f0f;
  --paper:#171717;
  --ink:#f5f5f5;
  --muted:#999999;
  --accent:#ff2442;
  --accent-soft:#3a171d;
  --tag-bg:#242424;
  --line:#2c2c2c;
  --link:#6fa0ff;
  --shadow:0 1px 2px rgba(0,0,0,0.25), 0 8px 24px rgba(0,0,0,0.25);

  color-scheme:dark;
}

body{ 
  background:var(--bg); 
}

.theme-toggle{
  position:fixed;
  top:20px;
  right:20px;
  width:34px;
  height:34px;
  padding:0;
  border:1px solid var(--line);
  border-radius:50%;
  background:var(--paper);
  color:var(--muted);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:
    background-color .15s ease,
    color .15s ease,
    border-color .15s ease;
}

.theme-toggle:hover{
  background:var(--tag-bg);
  color:var(--accent);
}

  .home{
  width:min(760px, calc(100vw - 48px));
  margin:0 auto;
  padding-top:14vh;
}

.brand{
  margin-bottom:32px;
}

.brand h1{
  margin:0;
  font-family:
    "Songti SC",
    "Noto Serif SC",
    "STSong",
    serif;
  font-size:30px;
  font-weight:500;
  letter-spacing:.02em;
  color:var(--ink);
}

.apps{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:16px;
}

.app-card{
  display:flex;
  align-items:center;
  min-height:150px;
  padding:24px;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--paper);
  color:var(--ink);
  text-decoration:none;
  box-shadow:var(--shadow);
  transition:
    background-color .15s ease,
    border-color .15s ease,
}

.app-card:hover{
  background:var(--paper);
  border-color:var(--accent);
}

.app-info{
  min-width:0;
  flex:1;
}

.app-title{
  font-family:
    "Songti SC",
    "Noto Serif SC",
    "STSong",
    serif;
  font-size:18px;
  font-weight:500;
}

.app-desc{
  margin-top:8px;
  color:var(--muted);
  font-family:
    "Songti SC",
    "Noto Serif SC",
    "STSong",
    serif;
  font-size:12px;
  line-height:1.6;
}

.app-arrow{
  flex:0 0 auto;
  margin-left:16px;
  color:var(--muted);
  font-size:20px;
  line-height:1;
}

.app-card:hover .app-arrow{
  color:var(--accent);
}

@media (max-width:600px){
  .home{
    width:calc(100vw - 32px);
    padding-top:10vh;
  }

  .apps{
    grid-template-columns:1fr;
  }
}
</style>
