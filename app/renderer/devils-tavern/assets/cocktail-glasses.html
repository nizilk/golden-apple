<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: transparent;
}

body {
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

svg {
  width: 108px;
  height: 158px;
  display: block;
  overflow: visible;
}
</style>
</head>

<body>

<svg
  id="glass"
  viewBox="0 0 108 158"
  xmlns="http://www.w3.org/2000/svg"
>
</svg>

<script>

const params =
  new URLSearchParams(
    window.location.search
  );

const shape =
  params.get("shape") || "martini";

const color =
  params.get("color") || "ruby";


const colors = {

  ruby: {
    main: "#9c3040",
    light: "#e16a65",
    dark: "#551a2b"
  },

  amber: {
    main: "#b8752c",
    light: "#e2ad5d",
    dark: "#68401e"
  },

  emerald: {
    main: "#477c62",
    light: "#80ad78",
    dark: "#203e34"
  },

  ocean: {
    main: "#397c93",
    light: "#76b9c1",
    dark: "#203d55"
  },

  violet: {
    main: "#714f83",
    light: "#aa78a7",
    dark: "#3b294a"
  }

};

const drink =
  colors[color] || colors.ruby;


const svg =
  document.getElementById("glass");


/* =========================================================
   DEFINITIONS
   ========================================================= */

svg.innerHTML = `

<defs>

  <linearGradient
    id="glass"
    x1="0"
    y1="0"
    x2="1"
    y2="1"
  >
    <stop
      offset="0"
      stop-color="#ffffff"
      stop-opacity=".42"
    />

    <stop
      offset=".35"
      stop-color="#ffffff"
      stop-opacity=".12"
    />

    <stop
      offset="1"
      stop-color="#000000"
      stop-opacity=".14"
    />
  </linearGradient>


  <linearGradient
    id="drink"
    x1="0"
    y1="0"
    x2="0"
    y2="1"
  >
    <stop
      offset="0"
      stop-color="${drink.light}"
    />

    <stop
      offset=".58"
      stop-color="${drink.main}"
    />

    <stop
      offset="1"
      stop-color="${drink.dark}"
    />
  </linearGradient>


  <linearGradient
    id="stem"
    x1="0"
    y1="0"
    x2="1"
    y2="0"
  >
    <stop
      offset="0"
      stop-color="#ffffff"
      stop-opacity=".12"
    />

    <stop
      offset=".5"
      stop-color="#ffffff"
      stop-opacity=".58"
    />

    <stop
      offset="1"
      stop-color="#ffffff"
      stop-opacity=".12"
    />
  </linearGradient>


  <linearGradient
    id="metal"
    x1="0"
    y1="0"
    x2="0"
    y2="1"
  >
    <stop
      offset="0"
      stop-color="#ffffff"
      stop-opacity=".48"
    />

    <stop
      offset="1"
      stop-color="#ffffff"
      stop-opacity=".12"
    />
  </linearGradient>

</defs>

`;


/* =========================================================
   MARTINI
   ========================================================= */

function martini() {

  svg.insertAdjacentHTML(
    "beforeend",
    `

    <path
      d="
        M13 12
        L95 12
        L75 68
        L33 68
        Z
      "
      fill="url(#glass)"
      stroke="#ffffff"
      stroke-opacity=".30"
      stroke-width="1.5"
    />

    <path
      d="
        M18 30
        L90 30
        L74 67
        L34 67
        Z
      "
      fill="url(#drink)"
    />

    <rect
      x="52"
      y="67"
      width="4"
      height="60"
      rx="2"
      fill="url(#stem)"
    />

    <ellipse
      cx="54"
      cy="130"
      rx="31"
      ry="4"
      fill="url(#metal)"
    />

    <path
      d="
        M27 18
        C31 17 34 19 37 24
        L32 51
        C30 43 29 30 27 18
      "
      fill="#ffffff"
      fill-opacity=".25"
    />

    <circle
      cx="91"
      cy="10"
      r="7"
      fill="#7d202c"
    />

    `
  );

}


/* =========================================================
   COUPE
   ========================================================= */

function coupe() {

  svg.insertAdjacentHTML(
    "beforeend",
    `

    <path
      d="
        M8 24
        C8 10 100 10 100 24
        C98 51 77 63 54 63
        C31 63 10 51 8 24
        Z
      "
      fill="url(#glass)"
      stroke="#ffffff"
      stroke-opacity=".30"
      stroke-width="1.5"
    />

    <path
      d="
        M15 29
        C17 49 34 57 54 57
        C74 57 91 49 93 29
        Z
      "
      fill="url(#drink)"
    />

    <rect
      x="52"
      y="61"
      width="4"
      height="61"
      rx="2"
      fill="url(#stem)"
    />

    <ellipse
      cx="54"
      cy="128"
      rx="31"
      ry="4"
      fill="url(#metal)"
    />

    <path
      d="
        M17 19
        C25 14 34 14 43 15
        C32 18 25 23 20 32
        Z
      "
      fill="#ffffff"
      fill-opacity=".20"
    />

    <circle
      cx="91"
      cy="18"
      r="13"
      fill="#e18b35"
      fill-opacity=".9"
    />

    `
  );

}


/* =========================================================
   HIGHBALL
   ========================================================= */

function highball() {

  svg.insertAdjacentHTML(
    "beforeend",
    `

    <rect
      x="27"
      y="10"
      width="54"
      height="106"
      rx="8"
      fill="url(#glass)"
      stroke="#ffffff"
      stroke-opacity=".28"
      stroke-width="1.5"
    />

    <rect
      x="28"
      y="43"
      width="52"
      height="72"
      rx="5"
      fill="url(#drink)"
    />

    <rect
      x="38"
      y="62"
      width="13"
      height="13"
      rx="3"
      transform="rotate(14 44 68)"
      fill="#ffffff"
      fill-opacity=".35"
    />

    <rect
      x="54"
      y="51"
      width="13"
      height="13"
      rx="3"
      transform="rotate(-9 60 57)"
      fill="#ffffff"
      fill-opacity=".30"
    />

    <rect
      x="47"
      y="76"
      width="13"
      height="13"
      rx="3"
      transform="rotate(24 53 82)"
      fill="#ffffff"
      fill-opacity=".25"
    />

    <path
      d="
        M31 18
        C35 15 39 14 43 14
        L39 49
        C35 39 33 29 31 18
      "
      fill="#ffffff"
      fill-opacity=".22"
    />

    <path
      d="
        M75 14
        L86 20
        L76 30
        Z
      "
      fill="#8b9e5d"
    />

    <path
      d="
        M73 18
        C80 12 85 10 91 12
        C87 19 81 23 74 25
        Z
      "
      fill="#52683e"
    />

    <ellipse
      cx="54"
      cy="117"
      rx="34"
      ry="4"
      fill="url(#metal)"
    />

    `
  );

}


/* =========================================================
   ROCKS
   ========================================================= */

function rocks() {

  svg.insertAdjacentHTML(
    "beforeend",
    `

    <rect
      x="16"
      y="42"
      width="76"
      height="73"
      rx="12"
      fill="url(#glass)"
      stroke="#ffffff"
      stroke-opacity=".28"
      stroke-width="1.5"
    />

    <rect
      x="19"
      y="62"
      width="70"
      height="50"
      rx="9"
      fill="url(#drink)"
    />

    <rect
      x="30"
      y="66"
      width="15"
      height="15"
      rx="3"
      transform="rotate(14 37 73)"
      fill="#ffffff"
      fill-opacity=".30"
    />

    <rect
      x="50"
      y="59"
      width="15"
      height="15"
      rx="3"
      transform="rotate(-9 57 66)"
      fill="#ffffff"
      fill-opacity=".28"
    />

    <rect
      x="57"
      y="78"
      width="15"
      height="15"
      rx="3"
      transform="rotate(24 64 85)"
      fill="#ffffff"
      fill-opacity=".22"
    />

    <path
      d="
        M22 50
        C27 46 31 45 37 46
        L33 72
        C28 65 25 57 22 50
      "
      fill="#ffffff"
      fill-opacity=".20"
    />

    <ellipse
      cx="54"
      cy="116"
      rx="40"
      ry="4"
      fill="url(#metal)"
    />

    <circle
      cx="86"
      cy="43"
      r="14"
      fill="#e18b35"
      fill-opacity=".9"
    />

    `
  );

}


/* =========================================================
   RENDER
   ========================================================= */

if (shape === "coupe") {
  coupe();

} else if (shape === "highball") {
  highball();

} else if (shape === "rocks") {
  rocks();

} else {
  martini();
}

</script>

</body>
</html>
