<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>恶魔酒馆</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;500;600&family=UnifrakturCook:wght@700&display=swap');

:root {
  --ink: #30241e;
  --paper: #eee0c0;
  --wood-dark: #302019;
  --wood: #54372a;
  --wood-mid: #765039;
  --wood-light: #a4774e;

  --wall-top: #342c29;
  --wall-mid: #4a3c36;
  --wall-bottom: #2b2522;

  --shadow: rgba(20, 13, 10, .42);
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  color: var(--ink);

  background:
    radial-gradient(
      ellipse at 50% 18%,
      rgba(190, 142, 87, .16),
      transparent 45%
    ),
    linear-gradient(
      180deg,
      #2c2522 0%,
      #171311 100%
    );

  font-family:
    "Segoe UI",
    "PingFang SC",
    "Hiragino Sans GB",
    "Microsoft YaHei",
    sans-serif;
}

button,
input {
  font: inherit;
}

button {
  border: 0;
}

[hidden] {
  display: none !important;
}

/* =========================================================
   MAIN
   ========================================================= */

#app {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.shop-stage {
  position: relative;

  width: 100%;
  height: 100%;

  display: flex;
  justify-content: center;
  align-items: stretch;

  overflow: hidden;
}

.wall-scene {
  position: relative;

  width: min(1320px, 100vw);
  height: 100%;

  overflow: hidden;

  background:
    radial-gradient(
      ellipse at 50% 22%,
      rgba(185, 139, 86, .16),
      transparent 45%
    ),
    linear-gradient(
      90deg,
      rgba(0,0,0,.22),
      transparent 15%,
      transparent 85%,
      rgba(0,0,0,.24)
    ),
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.018) 0,
      rgba(255,255,255,.018) 1px,
      transparent 1px,
      transparent 68px
    ),
    linear-gradient(
      180deg,
      var(--wall-top),
      var(--wall-mid) 50%,
      var(--wall-bottom)
    );

  box-shadow:
    inset 0 0 120px rgba(0,0,0,.42);
}

.wall-scene::before {
  content: "";

  position: absolute;
  inset: 0;

  pointer-events: none;

  opacity: .25;

  background:
    radial-gradient(
      circle at 20% 30%,
      rgba(196,145,90,.15) 0 1px,
      transparent 2px
    ),
    radial-gradient(
      circle at 80% 60%,
      rgba(196,145,90,.12) 0 1px,
      transparent 2px
    );

  background-size:
    85px 75px,
    120px 100px;
}

.wall-seam {
  position: absolute;

  top: 0;
  bottom: 0;

  width: 1px;

  opacity: .08;

  background: #c3a077;

  pointer-events: none;
}

.wall-seam.one {
  left: 17%;
}

.wall-seam.two {
  left: 83%;
}

/* =========================================================
   HANGING SIGN
   ========================================================= */

.title-sign {
  position: absolute;
  z-index: 40;

  top: clamp(28px, 5vh, 58px);
  left: 50%;

  transform:
    translateX(-50%)
    rotate(-.7deg);

  width: clamp(245px, 27vw, 360px);
  min-height: 105px;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 20px 38px 23px;

  background:
    linear-gradient(
      180deg,
      #704936,
      #543326 48%,
      #3b251c 100%
    );

  border-radius:
    5px
    5px
    8px
    8px;

  box-shadow:
    0 15px 22px rgba(0,0,0,.38),
    0 3px 5px rgba(0,0,0,.32),
    inset 0 1px rgba(255,255,255,.13),
    inset 0 -8px 12px rgba(0,0,0,.20);
}

.title-sign::before {
  content: "";

  position: absolute;
  inset: 7px;

  border:
    1px solid rgba(210,165,102,.42);

  border-radius: 3px;

  pointer-events: none;
}

.title-sign::after {
  content: "";

  position: absolute;

  left: 50%;
  bottom: -15px;

  width: 1px;
  height: 18px;

  background: rgba(20,13,10,.75);
}

.title-sign h1 {
  position: relative;
  z-index: 2;

  margin: 0;

  color: #e5c58e;

  text-align: center;
  white-space: nowrap;

  font-family:
    "Cinzel Decorative",
    "UnifrakturCook",
    "UnifrakturMaguntia",
    "Old English Text MT",
    fantasy;

  font-size:
    clamp(28px, 3.2vw, 43px);

  font-weight: 500;
  line-height: 1;

  text-shadow:
    0 2px 1px rgba(0,0,0,.72),
    0 0 10px rgba(215,160,88,.13);
}

.sign-rope {
  position: absolute;

  top: -25px;

  width: 2px;
  height: 28px;

  background:
    linear-gradient(
      90deg,
      #38271d,
      #9d754c,
      #38271d
    );
}

.sign-rope.left {
  left: 27px;
  transform: rotate(-2deg);
}

.sign-rope.right {
  right: 27px;
  transform: rotate(2deg);
}

/* =========================================================
   SHELF SCROLL
   ========================================================= */

.shelf-scroll-area {
  position: absolute;
  z-index: 8;

  top: clamp(160px, 20vh, 210px);
  left: clamp(30px, 7vw, 95px);
  right: clamp(30px, 7vw, 95px);
  bottom: clamp(205px, 25vh, 255px);

  overflow-y: auto;
  overflow-x: hidden;

  scrollbar-width: none;

  padding:
    8px
    clamp(8px, 2vw, 26px)
    40px;
}

.shelf-scroll-area::-webkit-scrollbar {
  display: none;
}

.shelf-rows {
  width: 100%;
  min-height: 100%;

  display: flex;
  flex-direction: column;

  gap: 30px;

  padding-bottom: 36px;
}

/* =========================================================
   COCKTAIL RACK
   ========================================================= */

.shelf-row {
  position: relative;

  width: 100%;
  min-height: 182px;

  display: flex;
  align-items: flex-end;
  justify-content: center;

  gap: 6px;

  padding:
    10px
    clamp(10px, 2vw, 26px)
    18px;
}

.shelf-row::before {
  content: "";

  position: absolute;

  left: 0;
  right: 0;
  bottom: 7px;

  height: 16px;

  border-radius:
    3px
    3px
    5px
    5px;

  background:
    linear-gradient(
      180deg,
      #986845,
      #69422d 45%,
      #40281e 100%
    );

  box-shadow:
    0 8px 12px rgba(0,0,0,.38),
    0 2px 2px rgba(0,0,0,.38),
    inset 0 1px rgba(255,255,255,.16),
    inset 0 -4px 6px rgba(0,0,0,.18);

  z-index: 0;
}

.shelf-row::after {
  content: "";

  position: absolute;

  left: 2%;
  right: 2%;
  bottom: 0;

  height: 8px;

  border-radius: 50%;

  background: rgba(0,0,0,.32);

  filter: blur(7px);

  z-index: -1;
}

.rack-bracket {
  position: absolute;

  bottom: 21px;

  width: 17px;
  height: 34px;

  border-radius: 2px;

  background:
    linear-gradient(
      90deg,
      #39251b,
      #765037,
      #352219
    );

  box-shadow:
    0 2px 4px rgba(0,0,0,.42);

  z-index: 1;
}

.rack-bracket::after {
  content: "";

  position: absolute;

  left: 50%;
  top: -3px;

  width: 7px;
  height: 7px;

  transform: translateX(-50%);

  border-radius: 50%;

  background: #201610;

  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.15);
}

.rack-bracket.left {
  left: 7%;
}

.rack-bracket.right {
  right: 7%;
}

/* =========================================================
   COCKTAIL SLOT
   ========================================================= */

.bottle-slot {
  position: relative;
  z-index: 4;

  width: 132px;
  min-width: 132px;
  height: 166px;

  display: flex;
  justify-content: center;
  align-items: flex-end;

  flex: 0 0 132px;

  transform:
    rotate(var(--tilt, 0deg))
    translateY(var(--lift, 0px));
}

.bottle-card {
  position: relative;

  width: 132px;
  height: 166px;

  display: flex;
  justify-content: center;
  align-items: flex-end;

  cursor: pointer;
  user-select: none;

  transition:
    transform .18s ease,
    filter .18s ease;
}

.bottle-card:hover {
  filter: brightness(1.05);
}

/* =========================================================
   COCKTAIL GLASS
   ========================================================= */

.bottle-visual {
  position: relative;

  width: 108px;
  height: 158px;

  display: flex;
  justify-content: center;
  align-items: flex-end;

  transition:
    transform .22s cubic-bezier(.2,.8,.25,1),
    filter .22s ease;
}

.bottle-card:hover .bottle-visual {
  transform:
    translateY(-12px)
    rotate(var(--hover-rotate, 0deg))
    scale(1.045);

  filter:
    drop-shadow(
      0 15px 10px rgba(0,0,0,.30)
    );
}

/* =========================================================
   GLASS TYPES
   ========================================================= */

.glass {
  position: absolute;

  left: 50%;
  bottom: 10px;

  transform: translateX(-50%);

  width: 82px;
  height: 134px;
}

/* --- Martini --- */

.glass-martini .glass-bowl {
  position: absolute;

  top: 0;
  left: 50%;

  width: 82px;
  height: 61px;

  transform: translateX(-50%);

  clip-path:
    polygon(
      0 0,
      100% 0,
      61% 100%,
      39% 100%
    );

  background:
    linear-gradient(
      105deg,
      rgba(255,255,255,.38),
      rgba(255,255,255,.10) 28%,
      rgba(255,255,255,.04) 48%,
      rgba(0,0,0,.12)
    );

  border-bottom:
    2px solid rgba(255,255,255,.42);

  overflow: hidden;
}

.glass-martini .liquid {
  position: absolute;

  left: 50%;
  bottom: 0;

  width: 72px;
  height: 42px;

  transform: translateX(-50%);

  clip-path:
    polygon(
      0 0,
      100% 0,
      62% 100%,
      38% 100%
    );

  background:
    linear-gradient(
      180deg,
      var(--drink-light),
      var(--drink-main) 60%,
      var(--drink-dark)
    );

  box-shadow:
    inset 0 7px 8px rgba(255,255,255,.16);
}

.glass-martini .stem {
  position: absolute;

  left: 50%;
  top: 55px;

  width: 4px;
  height: 62px;

  transform: translateX(-50%);

  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.16),
      rgba(255,255,255,.55),
      rgba(255,255,255,.14)
    );
}

.glass-martini .base {
  position: absolute;

  left: 50%;
  bottom: 0;

  width: 62px;
  height: 7px;

  transform: translateX(-50%);

  border-radius: 50%;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.48),
      rgba(255,255,255,.13)
    );
}

/* --- Coupe --- */

.glass-coupe .glass-bowl {
  position: absolute;

  top: 7px;
  left: 50%;

  width: 92px;
  height: 53px;

  transform: translateX(-50%);

  border-radius:
    50%
    50%
    44%
    44%;

  background:
    linear-gradient(
      110deg,
      rgba(255,255,255,.35),
      rgba(255,255,255,.06)
    );

  border-bottom:
    2px solid rgba(255,255,255,.35);

  overflow: hidden;
}

.glass-coupe .liquid {
  position: absolute;

  left: 50%;
  bottom: 2px;

  width: 79px;
  height: 38px;

  transform: translateX(-50%);

  border-radius:
    50%
    50%
    44%
    44%;

  background:
    linear-gradient(
      180deg,
      var(--drink-light),
      var(--drink-main) 60%,
      var(--drink-dark)
    );

  box-shadow:
    inset 0 5px 8px rgba(255,255,255,.15);
}

.glass-coupe .stem {
  position: absolute;

  left: 50%;
  top: 56px;

  width: 4px;
  height: 60px;

  transform: translateX(-50%);

  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.13),
      rgba(255,255,255,.53),
      rgba(255,255,255,.13)
    );
}

.glass-coupe .base {
  position: absolute;

  left: 50%;
  bottom: 0;

  width: 62px;
  height: 7px;

  transform: translateX(-50%);

  border-radius: 50%;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.44),
      rgba(255,255,255,.12)
    );
}

/* --- Highball --- */

.glass-highball .glass-bowl {
  position: absolute;

  left: 50%;
  top: 2px;

  width: 55px;
  height: 105px;

  transform: translateX(-50%);

  border-radius:
    7px
    7px
    11px
    11px;

  background:
    linear-gradient(
      100deg,
      rgba(255,255,255,.30),
      rgba(255,255,255,.07) 34%,
      rgba(0,0,0,.08)
    );

  border:
    1px solid rgba(255,255,255,.24);

  overflow: hidden;
}

.glass-highball .liquid {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  height: 73px;

  background:
    linear-gradient(
      180deg,
      var(--drink-light),
      var(--drink-main) 55%,
      var(--drink-dark)
    );
}

.glass-highball .stem {
  position: absolute;

  display: none;
}

.glass-highball .base {
  position: absolute;

  left: 50%;
  bottom: 0;

  width: 67px;
  height: 7px;

  transform: translateX(-50%);

  border-radius: 50%;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.42),
      rgba(255,255,255,.12)
    );
}

/* --- Rocks --- */

.glass-rocks .glass-bowl {
  position: absolute;

  left: 50%;
  bottom: 19px;

  width: 76px;
  height: 72px;

  transform: translateX(-50%);

  border-radius:
    7px
    7px
    15px
    15px;

  background:
    linear-gradient(
      105deg,
      rgba(255,255,255,.34),
      rgba(255,255,255,.06) 40%,
      rgba(0,0,0,.12)
    );

  border:
    1px solid rgba(255,255,255,.23);

  overflow: hidden;
}

.glass-rocks .liquid {
  position: absolute;

  left: 3px;
  right: 3px;
  bottom: 3px;

  height: 52px;

  border-radius:
    4px
    4px
    11px
    11px;

  background:
    linear-gradient(
      180deg,
      var(--drink-light),
      var(--drink-main) 55%,
      var(--drink-dark)
    );
}

.glass-rocks .stem {
  display: none;
}

.glass-rocks .base {
  position: absolute;

  left: 50%;
  bottom: 12px;

  width: 81px;
  height: 7px;

  transform: translateX(-50%);

  border-radius: 50%;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.34),
      rgba(255,255,255,.08)
    );
}

/* =========================================================
   GLASS DETAILS
   ========================================================= */

.glass::after {
  content: "";

  position: absolute;

  left: 18%;
  top: 9%;

  width: 7px;
  height: 48%;

  border-radius: 50%;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.48),
      rgba(255,255,255,.04)
    );

  opacity: .52;

  transform: rotate(8deg);
}

.ice {
  position: absolute;

  width: 13px;
  height: 13px;

  border-radius: 3px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.72),
      rgba(207,228,226,.18)
    );

  border:
    1px solid rgba(255,255,255,.30);

  transform: rotate(14deg);

  box-shadow:
    0 1px 3px rgba(0,0,0,.14);
}

.ice.i1 {
  left: 22px;
  bottom: 39px;
}

.ice.i2 {
  left: 40px;
  bottom: 50px;

  transform: rotate(-9deg);
}

.ice.i3 {
  left: 31px;
  bottom: 29px;

  transform: rotate(24deg);
}

.garnish-cherry {
  position: absolute;

  right: 7px;
  top: -3px;

  width: 15px;
  height: 15px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #ffb09e 0 13%,
      #a9323d 30%,
      #5d1821 100%
    );

  box-shadow:
    0 2px 4px rgba(0,0,0,.24);

  z-index: 10;
}

.garnish-cherry::before {
  content: "";

  position: absolute;

  left: 10px;
  bottom: 10px;

  width: 22px;
  height: 18px;

  border-left:
    1px solid #6e8451;

  border-radius: 70%;

  transform: rotate(24deg);
}

.garnish-orange {
  position: absolute;

  right: -2px;
  top: 3px;

  width: 31px;
  height: 31px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      #ffc66a 0 39%,
      #e18b35 40% 61%,
      #a95d2c 62% 100%
    );

  box-shadow:
    0 2px 4px rgba(0,0,0,.20);

  z-index: 10;
}

.garnish-lime {
  position: absolute;

  right: -2px;
  top: 2px;

  width: 31px;
  height: 16px;

  border-radius:
    100%
    0
    100%
    0;

  background:
    linear-gradient(
      135deg,
      #b8c56d,
      #637841
    );

  transform: rotate(-18deg);

  z-index: 10;
}

.garnish-leaf {
  position: absolute;

  left: 3px;
  top: -3px;

  width: 26px;
  height: 15px;

  border-radius:
    100%
    0
    100%
    0;

  background:
    linear-gradient(
      135deg,
      #82965a,
      #405437
    );

  transform: rotate(-20deg);

  z-index: 10;
}

/* =========================================================
   DRINK COLORS
   ========================================================= */

.drink-ruby {
  --drink-main: #9c3040;
  --drink-light: #e16a65;
  --drink-dark: #551a2b;
}

.drink-amber {
  --drink-main: #b8752c;
  --drink-light: #e2ad5d;
  --drink-dark: #68401e;
}

.drink-emerald {
  --drink-main: #477c62;
  --drink-light: #80ad78;
  --drink-dark: #203e34;
}

.drink-ocean {
  --drink-main: #397c93;
  --drink-light: #76b9c1;
  --drink-dark: #203d55;
}

.drink-violet {
  --drink-main: #714f83;
  --drink-light: #aa78a7;
  --drink-dark: #3b294a;
}

/* =========================================================
   LABEL
   ========================================================= */

.bottle-label {
  position: absolute;
  z-index: 15;

  left: 50%;
  bottom: 18px;

  transform:
    translateX(-50%)
    rotate(-1deg);

  width: 78px;
  min-height: 25px;

  padding:
    4px 6px 3px;

  display: flex;
  justify-content: center;
  align-items: center;

  color: #493326;

  background:
    linear-gradient(
      180deg,
      #e7d0a2,
      #c9aa71
    );

  border:
    1px solid rgba(73,48,28,.30);

  border-radius: 2px;

  box-shadow:
    0 2px 4px rgba(0,0,0,.22);

  font-family:
    "STKaiti",
    "KaiTi",
    "FangSong",
    serif;

  font-size: 13px;
  line-height: 1.15;

  text-align: center;

  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* =========================================================
   ACTIONS
   ========================================================= */

.bottle-actions {
  position: absolute;

  z-index: 30;

  top: 0;
  right: -1px;

  display: flex;
  gap: 4px;

  opacity: 0;

  pointer-events: none;

  transform: translateY(3px);

  transition:
    opacity .15s ease,
    transform .15s ease;
}

.bottle-card:hover .bottle-actions {
  opacity: 1;

  pointer-events: auto;

  transform: translateY(0);
}

.bottle-action {
  width: 25px;
  height: 25px;

  display: flex;
  justify-content: center;
  align-items: center;

  color: #ead5aa;

  background:
    rgba(44,29,21,.88);

  border-radius: 50%;

  cursor: pointer;

  box-shadow:
    0 3px 5px rgba(0,0,0,.28);
}

.bottle-action:hover {
  background:
    rgba(73,46,29,.96);
}

.bottle-action svg {
  width: 13px;
  height: 13px;

  fill: none;

  stroke: currentColor;
  stroke-width: 1.7;

  stroke-linecap: round;
  stroke-linejoin: round;
}

.bottle-card.dragging {
  opacity: .5;
}

/* =========================================================
   TABLE
   ========================================================= */

.work-table {
  position: absolute;

  z-index: 24;

  left: -4%;
  right: -4%;

  bottom: -4px;

  height:
    clamp(180px, 23vh, 235px);

  background:
    linear-gradient(
      180deg,
      #86593b 0%,
      #68432e 28%,
      #3f291f 100%
    );

  box-shadow:
    0 -9px 18px rgba(0,0,0,.38),
    inset 0 9px 11px rgba(255,214,155,.09),
    inset 0 -12px 18px rgba(0,0,0,.28);
}

.work-table::before {
  content: "";

  position: absolute;

  left: 0;
  right: 0;
  top: 0;

  height: 13px;

  background:
    linear-gradient(
      180deg,
      #ad794d,
      #6e452d
    );

/* ================================
   羊皮纸信笺：编辑 / 阅读共用
   ================================ */

.parchment {
  position: relative;
  width: clamp(560px, var(--parchment-width, 720px), 1000px);
  max-width: calc(100vw - 40px);
  max-height: calc(100vh - 40px);
  min-height: 520px;

  padding: 54px 64px 58px;

  /* 羊皮纸底色 + 纸张自然晕染 */
  background:
    radial-gradient(
      ellipse at 18% 12%,
      rgba(255, 248, 214, 0.72) 0%,
      rgba(255, 248, 214, 0) 34%
    ),
    radial-gradient(
      ellipse at 84% 88%,
      rgba(116, 69, 25, 0.13) 0%,
      rgba(116, 69, 25, 0) 42%
    ),
    radial-gradient(
      ellipse at 50% 50%,
      rgba(255, 250, 222, 0.45) 0%,
      rgba(196, 153, 82, 0.10) 100%
    ),
    linear-gradient(
      135deg,
      #e8d39e 0%,
      #f2dfad 28%,
      #ead29b 55%,
      #dfc38a 100%
    );

  /* 完全去掉黑色边框 */
  border: none;
  outline: none;

  /*
   * 不使用厚重黑色外框。
   * 这里只保留很轻的纸张接触感，
   * 主要依靠 inset 表现纸张厚度。
   */
  box-shadow:
    inset 0 0 42px rgba(105, 65, 25, 0.16),
    inset 0 0 9px rgba(91, 53, 20, 0.10),
    0 10px 24px rgba(45, 27, 13, 0.16);

  color: #4a321e;

  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;

  /*
   * 轻微的不规则纸边。
   * 不使用硬直角黑框。
   */
  border-radius:
    2px 3px 4px 2px /
    3px 2px 3px 4px;
}


/* 羊皮纸内部的旧纸纹理 */
.parchment::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;

  background:
    repeating-linear-gradient(
      0deg,
      rgba(103, 69, 29, 0.025) 0px,
      rgba(103, 69, 29, 0.025) 1px,
      transparent 1px,
      transparent 4px
    ),
    repeating-linear-gradient(
      90deg,
      rgba(255, 250, 220, 0.035) 0px,
      rgba(255, 250, 220, 0.035) 1px,
      transparent 1px,
      transparent 7px
    );

  mix-blend-mode: multiply;
  opacity: 0.72;
}


/* 四周自然的旧纸边缘 */
.parchment::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;

  background:
    linear-gradient(
      to right,
      rgba(103, 61, 22, 0.14),
      transparent 7%,
      transparent 93%,
      rgba(103, 61, 22, 0.13)
    ),
    linear-gradient(
      to bottom,
      rgba(103, 61, 22, 0.13),
      transparent 8%,
      transparent 92%,
      rgba(103, 61, 22, 0.16)
    );

  box-shadow:
    inset 0 0 35px rgba(91, 52, 18, 0.12);

  opacity: 0.75;
}

(() => {

  /* =========================================================
     HELPERS
     ========================================================= */

  function makeId() {

    return (
      Date.now().toString(36) +
      Math.random()
        .toString(36)
        .slice(2, 8)
    );

  }

  function normalizeImagePath(src) {

    if (!src) return "";

    let p =
      String(src).trim();

    if (
      p.startsWith("data:")
    ) {
      return p;
    }

    p =
      p.replace(/^\/+/, "");

    p =
      p.replace(
        /^data\//,
        ""
      );

    return p;

  }

  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }

  function randomBetween(
    min,
    max
  ) {

    return Math.random() *
      (max - min) +
      min;

  }

  /* =========================================================
     ELECTRON DATA
     ========================================================= */

  async function ensureDataDirs() {

    if (!window.electronAPI) {
      return;
    }

    try {

      await window.electronAPI
        .createDataDirectory(
          "devils-tavern"
        );

    } catch {}

    try {

      await window.electronAPI
        .createDataDirectory(
          IMAGE_DIR
        );

    } catch {}

  }

  async function loadPotions() {

    if (!window.electronAPI) {

      potions = [];

      return;

    }

    try {

      const raw =
        await window.electronAPI
          .readDataFile(
            DATA_PATH
          );

      const parsed =
        JSON.parse(
          raw || "[]"
        );

      potions =
        Array.isArray(parsed)
          ? parsed
          : [];

    } catch {

      potions = [];

    }

  }

  async function savePotions() {

    if (!window.electronAPI) {
      return;
    }

    await window.electronAPI
      .writeDataFile(
        DATA_PATH,
        JSON.stringify(
          potions,
          null,
          2
        )
      );

  }

  /* =========================================================
     IMAGE HANDLING
     ========================================================= */

  function fileToDataURL(file) {

    return new Promise(
      (resolve, reject) => {

        const reader =
          new FileReader();

        reader.onload =
          () => resolve(
            reader.result
          );

        reader.onerror =
          reject;

        reader.readAsDataURL(
          file
        );

      }
    );

  }

  function dataURLToBlob(
    dataURL
  ) {

    const parts =
      dataURL.split(",");

    const mimeMatch =
      parts[0].match(
        /:(.*?);/
      );

    const mime =
      mimeMatch
        ? mimeMatch[1]
        : "image/png";

    const binary =
      atob(parts[1]);

    const bytes =
      new Uint8Array(
        binary.length
      );

    for (
      let i = 0;
      i < binary.length;
      i++
    ) {

      bytes[i] =
        binary.charCodeAt(i);

    }

    return new Blob(
      [bytes],
      {
        type: mime
      }
    );

  }

  async function imageToBlob(
    file
  ) {

    const dataURL =
      await fileToDataURL(
        file
      );

    const img =
      new Image();

    img.src = dataURL;

    await img.decode();

    const max = 2200;

    const scale =
      Math.min(
        1,
        max /
          img.naturalWidth,
        max /
          img.naturalHeight
      );

    const canvas =
      document.createElement(
        "canvas"
      );

    canvas.width =
      Math.max(
        1,
        Math.round(
          img.naturalWidth *
          scale
        )
      );

    canvas.height =
      Math.max(
        1,
        Math.round(
          img.naturalHeight *
          scale
        )
      );

    const ctx =
      canvas.getContext(
        "2d"
      );

    ctx.drawImage(
      img,
      0,
      0,
      canvas.width,
      canvas.height
    );

    const webp =
      await new Promise(
        resolve => {

          canvas.toBlob(
            resolve,
            "image/webp",
            .90
          );

        }
      );

    if (webp) {

      return {

        blob: webp,

        dataURL:
          canvas.toDataURL(
            "image/webp",
            .90
          )

      };

    }

    return {

      blob:
        dataURLToBlob(
          dataURL
        ),

      dataURL

    };

  }

  async function saveImageFile(
    file,
    potionId
  ) {

    if (!window.electronAPI) {

      return {

        path: "",

        dataURL:
          await fileToDataURL(
            file
          )

      };

    }

    const result =
      await imageToBlob(
        file
      );

    const path =
      `${IMAGE_DIR}/${potionId}-${Date.now()}.webp`;

    await window.electronAPI
      .writeDataBinary(
        path,
        result.blob
      );

    return {

      path,

      dataURL:
        result.dataURL

    };

  }

  /* =========================================================
     HYDRATE IMAGES
     ========================================================= */

  async function hydrateImages(
    root
  ) {

    if (!root) return;

    const images =
      [
        ...root.querySelectorAll(
          "img"
        )
      ];

    for (
      const img of images
    ) {

      const localPath =
        normalizeImagePath(
          img.dataset.localSrc ||
          img.getAttribute(
            "src"
          ) ||
          ""
        );

      if (
        !localPath ||
        localPath.startsWith(
          "data:"
        )
      ) {
        continue;
      }

      img.dataset.localSrc =
        localPath;

      if (
        window.electronAPI &&
        window.electronAPI.readDataURL
      ) {

        try {

          const dataURL =
            await window.electronAPI
              .readDataURL(
                localPath
              );

          img.src =
            dataURL;

        } catch {}

      }

    }

  }

  function normalizeEditorImages(
    root
  ) {

    const clone =
      root.cloneNode(true);

    clone
      .querySelectorAll(
        "img"
      )
      .forEach(
        img => {

          const local =
            img.dataset.localSrc ||
            normalizeImagePath(
              img.getAttribute(
                "src"
              ) || ""
            );

          if (
            local &&
            !local.startsWith(
              "data:"
            )
          ) {

            img.setAttribute(
              "src",
              local
            );

          }

          img.removeAttribute(
            "data-local-src"
          );

        }
      );

    return clone.innerHTML;

  }

  /* =========================================================
     COCKTAIL DATA
     ========================================================= */

  function getDrinkClass(
    color
  ) {

    return {
      ruby:
        "drink-ruby",

      amber:
        "drink-amber",

      emerald:
        "drink-emerald",

      ocean:
        "drink-ocean",

      violet:
        "drink-violet"

    }[
      color
    ] || "drink-ruby";

  }

  function getBottleSlotCount() {

    const width =
      els.shelfScroll
        .clientWidth;

    if (width < 500) {
      return 3;
    }

    if (width < 720) {
      return 4;
    }

    if (width < 930) {
      return 5;
    }

    if (width < 1120) {
      return 6;
    }

    return 7;

  }

  /* =========================================================
     COCKTAIL GLASS CREATION
     ========================================================= */

  function createCocktailGlass(
    potion
  ) {

    const glass =
      document.createElement(
        "div"
      );

    const shape =
      potion.shape ||
      "martini";

    const color =
      potion.color ||
      "ruby";

    const className =
      shape === "coupe"
        ? "glass-coupe"
        : shape === "highball"
        ? "glass-highball"
        : shape === "rocks"
        ? "glass-rocks"
        : "glass-martini";

    glass.className =
      `glass ${className} ${getDrinkClass(color)}`;

    glass.innerHTML = `

      <div class="glass-bowl">

        <div class="liquid"></div>

        <span class="ice i1"></span>
        <span class="ice i2"></span>
        <span class="ice i3"></span>

      </div>

      <div class="stem"></div>

      <div class="base"></div>

    `;

    /*
      不把装饰做成数据库分类。
      只是让不同酒杯自然地有一点不同。
    */

    if (
      shape === "martini"
    ) {

      const cherry =
        document.createElement(
          "span"
        );

      cherry.className =
        "garnish-cherry";

      glass.appendChild(
        cherry
      );

    } else if (
      shape === "coupe"
    ) {

      const orange =
        document.createElement(
          "span"
        );

      orange.className =
        "garnish-orange";

      glass.appendChild(
        orange
      );

    } else if (
      shape === "highball"
    ) {

      const lime =
        document.createElement(
          "span"
        );

      lime.className =
        "garnish-lime";

      glass.appendChild(
        lime
      );

      const leaf =
        document.createElement(
          "span"
        );

      leaf.className =
        "garnish-leaf";

      glass.appendChild(
        leaf
      );

    } else {

      const orange =
        document.createElement(
          "span"
        );

      orange.className =
        "garnish-orange";

      glass.appendChild(
        orange
      );

    }

    return glass;

  }

  /* =========================================================
     COCKTAIL CARD
     ========================================================= */

  function createBottleCard(
    potion
  ) {

    const slot =
      document.createElement(
        "div"
      );

    slot.className =
      "bottle-slot";

    slot.style.setProperty(
      "--tilt",
      `${randomBetween(-2.3, 2.3).toFixed(2)}deg`
    );

    slot.style.setProperty(
      "--lift",
      `${randomBetween(-3, 3).toFixed(1)}px`
    );

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "bottle-card";

    card.draggable = true;

    card.dataset.id =
      potion.id;

    const visual =
      document.createElement(
        "div"
      );

    visual.className =
      "bottle-visual";

    visual.style.setProperty(
      "--hover-rotate",
      `${randomBetween(-1.5, 1.5).toFixed(2)}deg`

    visual.appendChild(
      createCocktailGlass(

    if (
      potion.title

      const label =
        document.createElement(
          "div"
        );

      label.className =

      label.textContent =

      visual.appendChild(
        label
      );

    }

    const actions =
      document.createElement(
        "div"
      );

    actions.className =
      "bottle-actions";

    actions.innerHTML = `

      <button

        title="编辑"
        aria-label="编辑"
      >
        <svg viewBox="0 0 24 24">

        title="删除"

        <svg viewBox="0 0 24 24">

          <path d="M9 7V4h6v3"></path>
          <path d="M7 7l1 13h8l1-13"></path>
          <path d="M10 11v5"></path>
          <path d="M14 11v5"></path>
        </svg>

    `;

    card.appendChild(
      visual
    );

    card.appendChild(
      actions
    );

    slot.appendChild(
      card
    );

    card.addEventListener(
      "click",
      event => {

        if (
          event.target.closest(
            ".bottle-action"
          )
        ) {
          return;
        }

        openView(
          potion.id
        );

      }
    );

    card
      .querySelector(
        ".edit-action"
      )
      .addEventListener(
        "click",
        event => {

          event.stopPropagation();

          openEditor(
            potion.id
          );

        }
      );

    card
      .querySelector(
        ".delete-action"
      )
      .addEventListener(
        "click",
        async event => {

          event.stopPropagation();

          await deletePotion(
            potion.id
          );

        }
      );

    /* =====================================================
       DRAG
       ===================================================== */

    card.addEventListener(
      "dragstart",
      event => {

        draggedPotionId =
          potion.id;

        card.classList.add(
          "dragging"
        );

        event.dataTransfer
          .effectAllowed =
          "move";

        event.dataTransfer
          .setData(
            "text/plain",
            potion.id
          );

      }
    );

    card.addEventListener(
      "dragend",
      () => {

        draggedPotionId =
          null;

        card.classList.remove(
          "dragging"
        );

      }
    );

    return slot;

  }

  /* =========================================================
     SHELF
     ========================================================= */

  function renderShelf() {

    els.shelfRows.innerHTML =
      "";

    const perRow =
      getBottleSlotCount();

    if (
      !potions.length
    ) {
      return;
    }

    for (
      let i = 0;
      i < potions.length;
      i += perRow
    ) {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "shelf-row";

      const leftBracket =
        document.createElement(
          "span"
        );

      leftBracket.className =
        "rack-bracket left";

      row.appendChild(
        leftBracket
      );

      const rightBracket =
        document.createElement(
          "span"
        );

      rightBracket.className =
        "rack-bracket right";

      row.appendChild(
        rightBracket
      );

      const group =
        potions.slice(
          i,
          i + perRow
        );

      group.forEach(
        potion => {

          row.appendChild(
            createBottleCard(
              potion
            )
          );

        }
      );

      els.shelfRows.appendChild(
        row
      );

    }

  }

  /* =========================================================
     DRAG / DROP
     ========================================================= */

  els.shelfScroll.addEventListener(
    "dragover",
    event => {

      event.preventDefault();

      event.dataTransfer.dropEffect =
        "move";

    }
  );

  els.shelfScroll.addEventListener(
    "drop",
    async event => {

      event.preventDefault();

      const sourceId =
        event.dataTransfer
          .getData(
            "text/plain"
          ) ||
        draggedPotionId;

      if (!sourceId) {
        return;
      }

      const cards =
        [
          ...els.shelfRows
            .querySelectorAll(
              ".bottle-card"
            )
        ];

      let targetCard =
        null;

      let bestDistance =
        Infinity;

      for (
        const card of cards
      ) {

        if (
          card.dataset.id ===
          sourceId
        ) {
          continue;
        }

        const rect =
          card.getBoundingClientRect();

        const centerX =
          rect.left +
          rect.width / 2;

        const centerY =
          rect.top +
          rect.height / 2;

        const distance =
          Math.hypot(
            event.clientX -
              centerX,
            event.clientY -
              centerY
          );

        if (
          distance <
          bestDistance
        ) {

          bestDistance =
            distance;

          targetCard =
            card;

        }

      }

      if (
        !targetCard
      ) {
        return;
      }

      const targetId =
        targetCard.dataset.id;

      const sourceIndex =
        potions.findIndex(
          p =>
            p.id ===
            sourceId
        );

      if (
        sourceIndex < 0
      ) {
        return;
      }

      const [
        moved
      ] =
        potions.splice(
          sourceIndex,
          1
        );

      let targetIndex =
        potions.findIndex(
          p =>
            p.id ===
            targetId
        );

      if (
        targetIndex < 0
      ) {

        potions.push(
          moved
        );

      } else {

        const rect =
          targetCard
            .getBoundingClientRect();

        const before =
          event.clientX <
          rect.left +
          rect.width / 2;

        if (
          !before
        ) {
          targetIndex += 1;
        }

        potions.splice(
          targetIndex,
          0,
          moved
        );

      }

      await savePotions();

      renderShelf();

    }
  );

  /* =========================================================
     MODAL
     ========================================================= */

  function openModal() {

    els.potionModal.hidden =
      false;

    document.body.style.overflow =

  function closeModal() {

    els.potionModal.hidden =

    document.body.style.overflow =
      "";

    currentPotionId =

  els.modalClose.addEventListener(

    closeModal
  );

  els.potionModal.addEventListener(
    "click",
    event => {

      if (
        event.target ===
        els.potionModal
      ) {

        closeModal();

      }

    }
  );

  /* =========================================================
     VIEW
     ========================================================= */

  async function openView(
    id
  ) {

    const potion =
      potions.find(
        p =>
          p.id === id
      );

    if (!potion) {
      return;
    }

    currentPotionId =
      id;

    els.editorPanel.hidden =
      true;

    els.viewPanel.hidden =
      false;

    els.viewTitle.textContent =
      potion.title || "";

    els.viewContent.innerHTML =
      potion.content || "";

    els.viewSource.innerHTML =
      potion.source
        ? `<span>${escapeHtml(
            potion.source
          )}</span>`
        : "";

    await hydrateImages(
      els.viewContent
    );

    await updateParchmentWidth(
      els.viewContent
    );

    openModal();

  }

  /* =========================================================
     STYLE
     ========================================================= */

  function setShape(
    shape
  ) {

    currentShape =
      shape;

    els.styleChoices
      .querySelectorAll(
        "[data-shape]"
      )
      .forEach(
        button => {

          button.classList.toggle(
            "active",
            button.dataset.shape ===
              shape
          );

        }
      );

  }

  function setColor(
    color
  ) {

    currentColor =
      color;

    els.styleChoices
      .querySelectorAll(
        "[data-color]"
      )
      .forEach(
        button => {

          button.classList.toggle(
            "active",
            button.dataset.color ===
              color
          );

        }
      );

  }

  els.styleChoices.addEventListener(
    "click",
    event => {

      const button =
        event.target.closest(
          ".style-choice"
        );

      if (!button) {
        return;
      }

      if (
        button.dataset.shape
      ) {

        setShape(
          button.dataset.shape
        );

      }

      if (
        button.dataset.color
      ) {

        setColor(
          button.dataset.color
        );

      }

    }
  );

  /* =========================================================
     EDITOR
     ========================================================= */

  function openEditor(
    id = null
  ) {

    currentPotionId =
      id;

    els.viewPanel.hidden =
      true;

    els.editorPanel.hidden =
      false;

    if (id) {

      const potion =
        potions.find(
          p =>
            p.id === id
        );

      if (!potion) {
        return;
      }

      els.titleInput.value =
        potion.title || "";

      els.sourceInput.value =
        potion.source || "";

      els.editorContent.innerHTML =
        potion.content || "";

      setShape(
        potion.shape ||
        "martini"
      );

      setColor(
        potion.color ||
        "ruby"
      );

      hydrateImages(
        els.editorContent
      );

    } else {

      els.titleInput.value =
        "";

      els.sourceInput.value =
        "";

      els.editorContent.innerHTML =
        "";

      setShape(
        "martini"
      );

      setColor(
        "ruby"
      );

    }

    resizeSourceUnderline();

    openModal();

    requestAnimationFrame(
      () => {

        els.editorContent.focus();

      }
    );

  }

  /* =========================================================
     SOURCE LINE
     ========================================================= */

  function resizeSourceUnderline() {

    const value =
      els.sourceInput.value ||
      " ";

    els.sourceMeasure.textContent =
      value;

    const width =
      Math.max(
        86,
        Math.min(
          240,
          els.sourceMeasure
            .getBoundingClientRect()
            .width + 12
        )
      );

    els.sourceInput.style.setProperty(
      "--source-line-width",
      `${width}px`
    );

    els.sourceInput.parentElement
      .style.setProperty(
        "--source-line-width",
        `${width}px`
      );

  }

  els.sourceInput.addEventListener(
    "input",
    resizeSourceUnderline
  );

  /* =========================================================
     IMAGE
     ========================================================= */

  els.imageButton.addEventListener(
    "click",
    () => {

      els.imageInput.click();

    }
  );

  els.imageInput.addEventListener(
    "change",
    async () => {

      const file =
        els.imageInput.files &&
        els.imageInput.files[0];

      if (!file) {
        return;
      }

      await insertImageFile(
        file
      );

      els.imageInput.value =
        "";

    }
  );

  async function insertImageFile(
    file
  ) {

    const potionId =
      currentPotionId ||
      makeId();

    const result =
      await saveImageFile(
        file,
        potionId
      );

    const img =
      document.createElement(
        "img"
      );

    img.src =
      result.dataURL;

    if (
      result.path
    ) {

      img.dataset.localSrc =
        result.path;

    }

    img.alt =
      "";

    const selection =
      window.getSelection();

    if (
      selection &&
      selection.rangeCount
    ) {

      const range =
        selection.getRangeAt(
          0
        );

      range.deleteContents();

      range.insertNode(
        img
      );

      range.setStartAfter(
        img
      );

      range.collapse(
        true
      );

      selection.removeAllRanges();

      selection.addRange(
        range
      );

    } else {

      els.editorContent
        .appendChild(
          img
        );

    }

  }

  /* =========================================================
     PASTE
     ========================================================= */

  els.editorContent.addEventListener(
    "paste",
    async event => {

      const items =
        [
          ...(
            event.clipboardData
              ?.items || []
          )
        ];

      const imageItem =
        items.find(
          item =>
            item.type.startsWith(
              "image/"
            )
        );

      if (imageItem) {

        event.preventDefault();

        const file =
          imageItem.getAsFile();

        if (file) {

          await insertImageFile(
            file
          );

        }

        return;
      }

      const text =
        event.clipboardData
          ?.getData(
            "text/plain"
          );

      if (
        text &&
        event.clipboardData
          ?.types
          ?.includes(
            "text/html"
          )
      ) {

        event.preventDefault();

        document.execCommand(
          "insertText",
          false,
          text
        );

      }

    }
  );

  /* =========================================================
     IMAGE DROP
     ========================================================= */

  els.editorContent.addEventListener(
    "dragover",
    event => {

      const types =
        [
          ...(
            event.dataTransfer
              ?.types || []
          )
        ];

      if (
        types.includes(
          "Files"
        )
      ) {

        event.preventDefault();

      }

    }
  );

  els.editorContent.addEventListener(
    "drop",
    async event => {

      const files =
        [
          ...(
            event.dataTransfer
              ?.files || []
          )
        ];

      const image =
        files.find(
          file =>
            file.type.startsWith(
              "image/"
            )
        );

      if (!image) {
        return;
      }

      event.preventDefault();

      await insertImageFile(
        image
      );

    }
  );

  /* =========================================================
     SAVE
     ========================================================= */

  els.saveButton.addEventListener(
    "click",
    async () => {

      const title =
        els.titleInput.value.trim();

      const source =
        els.sourceInput.value.trim();

      const content =
        normalizeEditorImages(
          els.editorContent
        );

      if (
        currentPotionId
      ) {

        const index =
          potions.findIndex(
            p =>
              p.id ===
              currentPotionId
          );

        if (
          index >= 0
        ) {

          potions[index] = {

            ...potions[index],

            title,

            content,

            source,

            shape:
              currentShape,

            color:
              currentColor

          };

        }

      } else {

        const potion = {

          id:
            makeId(),

          title,

          content,

          source,

          shape:
            currentShape,

          color:
            currentColor

        };

        potions.unshift(
          potion
        );

      }

      await savePotions();

      closeModal();

      renderShelf();

    }
  );

  /* =========================================================
     DELETE
     ========================================================= */

  async function deletePotion(
    id
  ) {

    const potion =
      potions.find(
        p =>
          p.id === id
      );

    if (!potion) {
      return;
    }

    const confirmed =
      window.confirm(
        "确定要让这杯记忆消失吗？"
      );

    if (!confirmed) {
      return;
    }

    potions =
      potions.filter(
        p =>
          p.id !== id
      );

    await savePotions();

    renderShelf();

  }

  /* =========================================================
     NEW COCKTAIL
     ========================================================= */

  els.newPotionButton.addEventListener(
    "click",
    () => {

      openEditor(
        null
      );

    }
  );

  /* =========================================================
     PARCHMENT WIDTH
     ========================================================= */

  async function updateParchmentWidth(
    root
  ) {

    const images =
      [
        ...root.querySelectorAll(
          "img"
        )
      ];

    if (
      !images.length
    ) {

      els.potionModal
        .querySelector(
          ".parchment"
        )
        .style.setProperty(
          "--parchment-width",
          "720px"
        );

      return;
    }

    await Promise.all(
      images.map(
        img => {

          if (
            img.complete
          ) {

            return Promise.resolve();

          }

          return new Promise(
            resolve => {

              img.addEventListener(
                "load",
                resolve,
                {
                  once: true
                }
              );

              img.addEventListener(
                "error",
                resolve,
                {
                  once: true
                }
              );

            }
          );

        }
      )
    );

    let largest = 0;

    images.forEach(
      img => {

        largest =
          Math.max(
            largest,
            img.naturalWidth ||
              0,
            img.getBoundingClientRect()
              .width ||
              0
          );

      }
    );

    const width =
      Math.max(
        680,
        Math.min(
          980,
          largest + 120
        )
      );

    els.potionModal
      .querySelector(
        ".parchment"
      )
      .style.setProperty(
        "--parchment-width",
        `${width}px`
      );

  }

  /* =========================================================
     RESIZE
     ========================================================= */

  let resizeTimer =
    null;

  window.addEventListener(
    "resize",
    () => {

      clearTimeout(
        resizeTimer
      );

      resizeTimer =
        setTimeout(
          () => {

            renderShelf();

          },
          120
        );

    }
  );

  /* =========================================================
     INIT
     ========================================================= */

  async function init() {

    await ensureDataDirs();

    await loadPotions();

    renderShelf();

  }

  init();

})();
</script>

</body>
</html>
